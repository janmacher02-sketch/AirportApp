services:
  - type: web
    name: airportready
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/airportready-data
      - key: ALLOW_PAID_SERVICES
        value: "false"
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
